<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>درجة الحرارة والطاقة الحرارية | فيزياء 2</title>
<style>
@font-face{font-family:'SMFallback';src:url(fonts/almarai-arabic-400-normal.woff2) format('woff2');font-weight:400;size-adjust:72%;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:'SMFallback';src:url(fonts/almarai-arabic-700-normal.woff2) format('woff2');font-weight:700;size-adjust:72%;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F}
@font-face{font-family:'SMFallback';src:url(fonts/almarai-latin-400-normal.woff2) format('woff2');font-weight:400;size-adjust:72%}
@font-face{font-family:'SMFallback';src:url(fonts/almarai-latin-700-normal.woff2) format('woff2');font-weight:700;size-adjust:72%}
@font-face{font-family:'Almarai';src:url(fonts/almarai-arabic-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:'Almarai';src:url(fonts/almarai-arabic-700-normal.woff2) format('woff2');font-weight:700}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d1622;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#fff;
  font-family:'Sakkal Majalla','Majalla','SMFallback','Almarai',sans-serif;cursor:default;user-select:none;-webkit-user-select:none}
.slide{position:absolute;inset:0;overflow:hidden;background:#fff}
.shp{position:absolute}
.inn{position:absolute;inset:0;transform-origin:50% 50%}
.geo{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.stroke{position:absolute;pointer-events:none}
.imgbox{position:absolute;inset:0;overflow:hidden}
.imgbox img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.vid{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible;word-wrap:break-word;white-space:pre-wrap}
.tx .p{margin:0}
.clickable{cursor:pointer}
/* controls */
#bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;
  background:rgba(13,22,34,.82);backdrop-filter:blur(6px);padding:6px 8px;border-radius:14px;
  font:600 15px 'Almarai','Sakkal Majalla',sans-serif;color:#fff;opacity:0;transition:opacity .3s;z-index:10;direction:rtl}
body.ui #bar{opacity:1}
#bar button{all:unset;cursor:pointer;min-width:38px;height:38px;display:grid;place-items:center;border-radius:10px;font-size:18px}
#bar button:hover{background:rgba(255,255,255,.14)}
#counter{min-width:64px;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
#menu{position:fixed;top:0;right:0;height:100%;width:min(360px,88vw);background:#fff;z-index:20;transform:translateX(105%);
  transition:transform .3s;box-shadow:-8px 0 30px rgba(0,0,0,.3);display:flex;flex-direction:column;font-family:'Almarai',sans-serif}
#menu.open{transform:none}
#menu h2{margin:0;padding:16px 18px;font-size:17px;background:#1E3557;color:#fff;display:flex;justify-content:space-between;align-items:center}
#menu h2 button{all:unset;cursor:pointer;font-size:20px}
#list{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
#list li{display:flex;gap:10px;padding:9px 18px;cursor:pointer;font-size:14px;color:#1E3557;align-items:baseline}
#list li b{min-width:26px;color:#A8741A}
#list li:hover{background:#f3ece0}
#list li.on{background:#FBF0DC;font-weight:700}
@media (hover:none){body #bar{opacity:1}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar">
  <button id="bMenu" title="قائمة الشرائح" aria-label="قائمة الشرائح">☰</button>
  <button id="bPrev" title="السابق" aria-label="السابق">▶</button>
  <span id="counter"></span>
  <button id="bNext" title="التالي" aria-label="التالي">◀</button>
  <button id="bFs" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
</div>
<nav id="menu"><h2>شرائح الدرس <button onclick="document.getElementById('menu').classList.remove('open')" aria-label="إغلاق">✕</button></h2><ol id="list"></ol></nav>
<script src="data.js"></script>
<script src="engine.js"></script>
</body>
</html>
