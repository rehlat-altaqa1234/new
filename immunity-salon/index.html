<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صالون الخلية البائية · المناعة والمرض</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
:root{
  --bg:#f3fbf9; --paper:#ffffff; --ink:#2a1f2b; --muted:#6a6170;
  --green:#127a6e; --green-2:#1fa391; --green-soft:#dcf5f0;
  --lilac:#8456cf; --lilac-soft:#f1eafc; --pink:#e46aa0; --pink-soft:#fde8f1; --gold:#f2b630; --gold-soft:#fff4d6;
  --line:#d6e6e2; --red:#cf4242; --red-soft:#fdeaea; --outline:#3d2433;
  --f:"Almarai",Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(circle at 20px 20px,#cdeee7 3px,transparent 4px),radial-gradient(circle at 60px 60px,#f4d3e4 3px,transparent 4px);background-size:80px 80px}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:10px 18px;box-shadow:0 6px 20px -14px rgba(18,122,110,.5)}
header .art{height:76px;width:auto}
.brand{flex:1;min-width:220px}
.brand h1{font-weight:800;font-size:clamp(28px,3.4vw,44px);line-height:1.15;margin:0;color:var(--green)}
.brand h1 span{color:var(--pink)}
.brand p{margin:0;color:var(--muted);font-size:14px}
.modeTag{display:inline-block;background:var(--lilac-soft);color:var(--lilac);font-weight:800;border-radius:999px;padding:0 10px;font-size:13px;margin-inline-start:6px}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}

main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:14px;align-items:start}
@media (max-width:980px),(orientation:portrait){main{grid-template-columns:1fr}}

.board{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.board .corner{position:absolute;left:-6px;bottom:-6px;height:130px;opacity:.95;pointer-events:none}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qnum{font-weight:800;font-size:22px;color:var(--lilac);background:var(--lilac-soft);border-radius:12px;padding:2px 14px}
.qtrack{flex:1;height:8px;background:var(--green-soft);border-radius:8px;overflow:hidden;max-width:220px}
.qtrack i{display:block;height:100%;background:var(--green-2);border-radius:8px;transition:width .3s}
.qtext{font-size:clamp(20px,2vw,27px);font-weight:700;line-height:1.55;margin:4px 0 2px;text-wrap:balance;min-height:2.2em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:10px;text-align:start;border:2px solid var(--line);background:#fbfefd;border-radius:14px;padding:12px 14px;font-size:clamp(16px,1.5vw,20px);font-weight:700;color:var(--ink);transition:transform .15s,border-color .15s,background .15s}
.opt:hover:not([disabled]){border-color:var(--green-2);transform:translateY(-2px)}
.opt b{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-weight:800;font-size:20px}
.opt.ok{border-color:var(--green-2);background:var(--green-soft)}
.opt.ok b{background:var(--green-2);color:#fff}
.opt.no{border-color:var(--red);background:var(--red-soft)}
.opt.no b{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.explain{background:var(--gold-soft);border:1px solid #f3dd9b;border-radius:14px;padding:10px 14px;font-size:16px;margin-left:110px}
.explain strong{color:#7a5600}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:0 0 0 110px}
.qnav{display:flex;justify-content:space-between;gap:8px;position:relative;z-index:1;padding-left:110px}
@media (max-width:520px){.explain,.hint{margin-left:0}.qnav{padding-left:0}.board .corner{display:none}}

.students{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.students.n2,.students.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.students.solo{grid-template-columns:1fr}
.students.solo .card{max-width:440px;width:100%;margin:0 auto}
@media (max-width:620px){.students{gap:8px}.card{padding:6px 6px 8px;border-radius:16px}.nameIn{font-size:19px}.plus{font-size:13px;padding:7px 4px}.dots i{width:7px;height:7px}.score{font-size:12px}.score b{font-size:18px}.crownTag{font-size:10px;padding:0 6px;top:4px}}
@media (orientation:landscape) and (min-width:981px){.students:not(.solo) .mirror{max-height:calc((100vh - 380px)/2)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.card.lead{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.mirror{width:100%;aspect-ratio:1/1.05;border-radius:50% 50% 16px 16px;background:radial-gradient(circle at 50% 42%,#ffffff 0,#f0faf8 58%,#dbf1ec 100%);display:grid;place-items:center;overflow:hidden;border:none;padding:0;position:relative}
.mirror svg{width:100%;height:100%;display:block}
.mirror.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
.nameIn{font-weight:800;font-size:24px;line-height:1.1;color:var(--green);font-family:var(--f);width:100%;min-width:0;text-align:center;border:none;border-bottom:2px dashed var(--line);background:transparent;padding:2px 4px}
.nameIn::placeholder{color:#a9bdb6}
.nameIn:focus{outline:none;border-bottom-color:var(--pink)}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pink)}
.score{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{font-weight:800;font-size:22px;color:var(--ink)}
.plus{width:100%;border:none;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:16px;padding:8px}
.plus:hover{background:var(--green-2)}
.crownTag{position:absolute;top:8px;inset-inline-end:10px;background:var(--gold);color:#3b2a00;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;z-index:2}
.soloNote{font-size:14px;color:var(--muted);text-align:center;margin:0}

.ov{position:fixed;inset:0;background:rgba(30,25,40,.55);display:grid;place-items:center;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel{background:var(--paper);border-radius:24px;max-width:1000px;width:100%;max-height:100%;overflow:auto;padding:20px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.35fr);gap:18px;align-items:start}
@media (max-width:760px),(orientation:portrait){.panel{grid-template-columns:1fr}.bigMirror{max-width:320px;margin:0 auto;width:100%}}
.panel h2{font-weight:800;font-size:30px;margin:0;color:var(--green);line-height:1.2}
.panel .sub{margin:0 0 8px;color:var(--muted)}
.bigMirror{border-radius:50% 50% 24px 24px;aspect-ratio:1/1.05;background:radial-gradient(circle at 50% 42%,#fff 0,#f0faf8 58%,#d5efe9 100%);overflow:hidden;border:6px solid var(--pink-soft);position:relative}
.bigMirror svg{width:100%;height:100%;display:block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{border:2px solid var(--line);border-radius:16px;background:#fbfefd;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;text-align:center}
.tile .ic{width:52px;height:52px;border:none;background:var(--pink-soft);border-radius:14px;display:grid;place-items:center;padding:0}
.tile .ic svg{width:38px;height:38px}
.tile .tn{font-weight:700;font-size:13px;line-height:1.3;min-height:2.6em;display:flex;align-items:center}
.tile.done{border-color:var(--pink);background:var(--pink-soft)}
.tile.done::after{content:"✓";position:absolute;top:4px;inset-inline-start:8px;color:var(--pink);font-weight:800}
.tile.locked{opacity:.42}
.tile.avail{border-color:var(--green-2);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 4px var(--green-soft)}}
.tile .lk{font-size:11px;color:var(--muted)}
.sw{display:flex;gap:4px;min-height:20px;flex-wrap:wrap;justify-content:center}
.sw button{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.sel{box-shadow:0 0 0 2px var(--ink)}
.status{border-radius:14px;padding:8px 12px;font-weight:700;margin:6px 0 10px}
.status.go{background:var(--green-soft);color:var(--green)}
.status.done{background:var(--gold-soft);color:#7a5600}
.status.view{background:#f1f4f3;color:var(--muted)}
.prow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.msg{display:flex;gap:10px;align-items:center;background:var(--pink-soft);border:1.5px dashed var(--pink);border-radius:16px;padding:8px 12px;margin:6px 0 10px;animation:pop .5s ease}
.msg .mi{flex:none;width:46px;height:46px;background:#fff;border-radius:12px;display:grid;place-items:center}
.msg .mi svg{width:34px;height:34px}
.msg p{margin:0;font-weight:700;line-height:1.5}
.msg p small{display:block;font-weight:400;color:var(--muted)}
.burst{position:absolute;inset:0;pointer-events:none}
.burst i{position:absolute;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark .9s ease-out forwards}
@keyframes spark{from{opacity:1;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}

.intro{background:var(--paper);border-radius:26px;max-width:1080px;width:100%;max-height:100%;overflow:auto;padding:22px;text-align:center}
.intro h2{font-weight:800;font-size:clamp(30px,4vw,48px);color:var(--green);margin:0;line-height:1.2;text-wrap:balance}
.intro h2 span{color:var(--pink)}
.intro .lede{margin:6px auto 14px;max-width:62ch;font-size:18px;color:var(--muted)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px;margin:0 auto}
@media (max-width:620px){.modes{grid-template-columns:1fr}}
.mode{border:3px solid var(--line);background:var(--bg);border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mode .mp{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:120px}
.mode .mp img{height:100%;width:auto}
.mode .mp .ar{font-weight:800;font-size:26px;color:var(--pink);align-self:center}
.mode b{font-size:24px;color:var(--green)}
.mode span{font-size:15px;color:var(--muted)}
.mode.sel{border-color:var(--pink);background:var(--pink-soft);box-shadow:0 0 0 4px #fbd3e5}
.setup{margin-top:14px}
.countRow{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-weight:700}
.countRow button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;color:var(--green)}
.countRow button.sel{background:var(--green);color:#fff;border-color:var(--green)}
.sgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:6px}
.sgrid.solo{grid-template-columns:minmax(0,240px);justify-content:center}
@media (max-width:900px),(orientation:portrait){.sgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.nslot{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.nslot.filled{border-color:var(--green-2);background:var(--green-soft)}
.nslot.miss{border-color:var(--red);animation:shake .4s}
.nslot svg{width:100%;max-width:120px;height:auto;border-radius:50% 50% 12px 12px;background:radial-gradient(circle at 50% 42%,#fff 0,#f0faf8 58%,#dbf1ec 100%)}
.nslot .nameIn{font-size:19px}
.nwarn{color:var(--red);font-weight:700;margin:10px 0 0;min-height:1.6em}
.howT{font-weight:800;font-size:clamp(22px,2.6vw,30px);color:var(--lilac);margin:14px 0 10px;display:flex;align-items:center;gap:12px}
.howT::before,.howT::after{content:"";flex:1;height:2px;background:var(--line)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px),(orientation:portrait){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.step:nth-child(5){grid-column:1 / -1}}
.step{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.step .pic{height:120px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.step .pic img{height:100%;width:auto}
.step .pic .ar{font-weight:800;font-size:24px;color:var(--pink);align-self:center}
.step .n{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center}
.step h3{margin:0;font-size:18px;line-height:1.4}
.step p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}

.win{max-width:1000px;width:100%;background:var(--paper);border-radius:26px;padding:22px;text-align:center;position:relative;overflow:hidden;max-height:100%;overflow-y:auto}
.win h2{font-weight:800;font-size:clamp(32px,4vw,52px);color:var(--green);margin:0;line-height:1.2}
.win h2 span{color:var(--pink)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin-top:14px;flex-wrap:wrap;position:relative}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;width:min(220px,30%)}
.pod.only{width:min(300px,70%)}
.pod .pm{width:100%;border-radius:50% 50% 16px 16px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#f0faf8 58%,#dbf1ec 100%)}
.pod .pm svg{display:block;width:100%}
.pod .blk{width:100%;border-radius:14px 14px 0 0;color:#fff;font-weight:800;font-size:26px;display:grid;place-items:center;padding:6px}
.pod.p1 .blk{background:var(--gold);color:#3b2a00;height:110px}
.pod.p2 .blk{background:var(--lilac);height:80px}
.pod.p3 .blk{background:var(--green-2);height:60px}
.pod.only .blk{height:auto;font-size:20px;line-height:1.5}
.pod .nm{font-weight:800;font-size:24px}
.side{position:absolute;bottom:0;height:42%;opacity:.95;pointer-events:none}
.side.l{left:6px}.side.r{right:6px}
@media (max-width:760px){.side{display:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.certrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px;position:relative}

.cert{position:relative;background:#fffdf8;color:var(--ink);width:min(920px,100%);max-height:100%;overflow:auto;border-radius:18px;padding:14px}
.cert .frame{border:3px solid var(--pink);border-radius:12px;padding:26px 30px 20px;position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:8px 22px;align-items:center;background:#fffdf8}
.cert .frame::before{content:"";position:absolute;inset:7px;border:2px solid var(--green);border-radius:8px;pointer-events:none}
.cert .frame>*{position:relative}
.cert .top{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-start;font-size:14px;color:#4b4250;line-height:1.6;gap:12px}
.cert .top b{color:var(--green)}
.cert h2{grid-column:1/-1;text-align:center;font-weight:800;font-size:clamp(30px,4.4vw,50px);color:var(--green);margin:2px 0 0;line-height:1.2}
.cert h2 span{color:var(--pink)}
.cert .body{font-size:clamp(17px,2vw,21px);line-height:2;text-align:center}
.cert .who{display:block;font-weight:800;font-size:clamp(30px,4vw,44px);color:var(--lilac);line-height:1.4}
.cert .pic{border-radius:50% 50% 16px 16px;overflow:hidden;background:radial-gradient(circle at 50% 42%,#fff 0,#f0faf8 58%,#dbf1ec 100%);border:3px solid var(--pink)}
.cert .pic svg{display:block;width:100%}
.cert .rank{display:block;text-align:center;margin-top:6px;font-weight:800;color:#3b2a00;background:var(--gold);border-radius:999px;padding:2px 10px}
.cert .sign{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:16px;color:#4b4250}
.cert .sign b{display:block;color:var(--green);font-size:18px}
@media (max-width:640px){.cert .frame{grid-template-columns:1fr;padding:20px 16px}.cert .pic{max-width:160px;justify-self:center}}

.confirm{background:var(--paper);border-radius:20px;padding:22px;max-width:420px;text-align:center}
.confirm h3{font-weight:800;font-size:28px;margin:0 0 6px;color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:60;display:flex;align-items:flex-end;gap:10px;background:var(--paper);border:2px solid var(--green-2);border-radius:22px;padding:0 18px 0 8px;max-width:min(560px,calc(100vw - 32px));box-shadow:0 14px 34px -14px rgba(30,40,50,.55);transition:transform .45s cubic-bezier(.2,1.4,.4,1)}
.toast.show{transform:translate(-50%,0)}
.toast.wrong{border-color:var(--gold)}
.toast img{height:100px;width:auto;margin-top:-30px;flex:none}
.toast div{padding:12px 0;min-width:0}
.toast b{display:block;font-weight:800;font-size:24px;line-height:1.2;color:var(--green)}
.toast.wrong b{color:#9a6b00}
.toast span{font-size:16px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#e0a21c"/></linearGradient>
<linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7f9"/><stop offset="1" stop-color="#9aa6ad"/></linearGradient>
<linearGradient id="rose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd3d6"/><stop offset="1" stop-color="#d27e88"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
</defs></svg>

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}}
function lighten(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.round(r+(255-r)*a);g=Math.round(g+(255-g)*a);b=Math.round(b+(255-b)*a);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
const OL="#3d2433";
function os(d,c,w){return `<path d="${d}" stroke="${OL}" stroke-width="${w+2.6}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}
function receptors(col){
  let g="";
  for(const deg of [200,160,20,-20,238,302]){
    const t=deg*Math.PI/180,cx=100,cy=122;
    const p=(r,off=0)=>{const a=t+off;return [cx+r*Math.cos(a),cy-r*Math.sin(a)];};
    const [x1,y1]=p(56),[x2,y2]=p(74),[x3,y3]=p(84,.24),[x4,y4]=p(84,-.24);
    const d=`M${x1.toFixed(1)},${y1.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} M${x3.toFixed(1)},${y3.toFixed(1)} L${x2.toFixed(1)},${y2.toFixed(1)} L${x4.toFixed(1)},${y4.toFixed(1)}`;
    g+=os(d,col,4.2);
    if(col!=="#efe6f2")g+=`<circle cx="${x3.toFixed(1)}" cy="${y3.toFixed(1)}" r="2.6" fill="#fff"/><circle cx="${x4.toFixed(1)}" cy="${y4.toFixed(1)}" r="2.6" fill="#fff"/>`;
  }
  return g;
}

  return g;
}

  g+=`<path d="M38,180 L44,196 L50,186 L56,196 L58,180 Z" fill="${c2}" stroke="${OL}" stroke-width="3" stroke-linejoin="round"/><rect x="38" y="174" width="20" height="7" rx="3.5" fill="#fff" stroke="${OL}" stroke-width="2.4"/>`;
  return g;
}
function hairBraid(c1,c2){return halfBraid(c1,c2)+`<g transform="translate(200,0) scale(-1,1)">${halfBraid(c2,c1)}</g>`;}

function avatar(s,i){
  const L=s.look, body=BODY[i%6], bd=lighten(body,-0)||body;
  const [c1,c2]=L.dye?DYES[L.dye]:["#b8a7b6","#a08f9e"];
  const stage=L.braid?3:L.wave?2:L.detangle?1:0;
  const abc=L.ab||"#efe6f2";
  let g="";
  // feet & arms
  g+=`<ellipse cx="80" cy="184" rx="12" ry="13" fill="${body}" stroke="${OL}" stroke-width="3.4"/><ellipse cx="120" cy="184" rx="12" ry="13" fill="${body}" stroke="${OL}" stroke-width="3.4"/>`;
  g+=`<ellipse cx="44" cy="154" rx="10" ry="12" fill="${body}" stroke="${OL}" stroke-width="3.4" transform="rotate(30 44 154)"/><ellipse cx="156" cy="154" rx="10" ry="12" fill="${body}" stroke="${OL}" stroke-width="3.4" transform="rotate(-30 156 154)"/>`;
  g+=receptors(abc);
  // body
  g+=`<circle cx="100" cy="122" r="58" fill="${body}" stroke="${OL}" stroke-width="3.6"/>`;
  g+=`<ellipse cx="78" cy="96" rx="14" ry="8" fill="#fff" opacity=".28" transform="rotate(-25 78 96)"/>`;
  // braids behind? no – hair drawn later
  // blush
  if(L.blush)g+=`<ellipse cx="66" cy="142" rx="10" ry="6" fill="${L.blush}" opacity=".75" filter="url(#soft)"/><ellipse cx="134" cy="142" rx="10" ry="6" fill="${L.blush}" opacity=".75" filter="url(#soft)"/>`;
  // eyes
  for(const [cx,sg] of [[80,-1],[120,1]]){
    g+=`<ellipse cx="${cx}" cy="128" rx="11" ry="12" fill="${OL}"/><circle cx="${cx+3.5}" cy="123" r="4.2" fill="#fff"/><circle cx="${cx-3.5}" cy="133" r="2" fill="#fff"/><circle cx="${cx+4}" cy="133" r="1.4" fill="#f7a8c8"/>`;
    if(L.lashes){const c=L.lashes,ox=cx+sg*10;g+=`<path d="M${ox},121 l${sg*6},-5 M${ox-sg*4},117 l${sg*4},-6 M${ox-sg*9},115 l${sg*1.5},-6" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;}
  }
  // mouth
  g+= L.lips
   ? `<path d="M90,145 Q100,147 110,145 Q100,158 90,145 Z" fill="${L.lips}" stroke="${OL}" stroke-width="2.4" stroke-linejoin="round"/>`
   : `<path d="M92,146 Q100,${score(s)>0?154:151} 108,146" stroke="${OL}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  // glasses
  if(L.glasses){const c=L.glasses;g+=`<circle cx="80" cy="128" r="17" fill="rgba(220,240,255,.25)" stroke="${c}" stroke-width="3.6"/><circle cx="120" cy="128" r="17" fill="rgba(220,240,255,.25)" stroke="${c}" stroke-width="3.6"/><path d="M97,126 Q100,122 103,126" stroke="${c}" stroke-width="3.2" fill="none"/>`;}
  // hair
  g+= stage===0?hairMessy(i,c1,c2):stage===1?hairCurly(c1,c2):stage===2?hairWave(c1,c2):hairBraid(c1,c2);
  // bow
  if(L.bow){const c=L.bow;g+=`<g transform="translate(140,62) rotate(15)"><path d="M0,0 L-18,-11 L-16,11 Z" fill="${c}" stroke="${OL}" stroke-width="2.6" stroke-linejoin="round"/><path d="M0,0 L18,-11 L16,11 Z" fill="${c}" stroke="${OL}" stroke-width="2.6" stroke-linejoin="round"/><circle r="5.5" fill="${lighten(c,.25)}" stroke="${OL}" stroke-width="2.4"/></g>`;}
  // crown
  if(L.crown){const f={'#c9d1d6':'silver','#e8a0a8':'rose'}[L.crown]||'gold',st={silver:'#7d8a92',rose:'#b5606b'}[f]||'#c98a10';
    g+=`<g transform="translate(100,${stage===0?40:46})"><path d="M-28,10 L-24,-10 L-13,2 L0,-16 L13,2 L24,-10 L28,10 Z" fill="url(#${f})" stroke="${OL}" stroke-width="2.6" stroke-linejoin="round"/><circle cx="0" cy="-2" r="3.4" fill="#e94e8a"/><circle cx="-24" cy="-11" r="3" fill="#8456cf"/><circle cx="24" cy="-11" r="3" fill="#8456cf"/></g>`;}
  return `<svg viewBox="0 0 200 210" role="img" aria-label="خلية ${dn(s)}">${g}</svg>`;
}

let M=null;
function openModal(i,token){M={i,token};renderModal();$("modal").hidden=false;}
function closeModal(){const i=M?.i;$("modal").hidden=true;M=null;renderStudents(i);}
function swatch(it,c){return it.id==="dye"?`linear-gradient(90deg,${DYES[c][0]} 50%,${DYES[c][1]} 50%)`:c;}
function renderModal(){
  const s=S.students[M.i],all=s.order.length>=ITEMS.length;
  let status;
  if(M.token&&!all)status=`<div class="status go">أحسنتِ يا ${dn(s)}! اختاري خدمة واحدة من الصالون 🌟</div>`;
  else if(M.token&&all)status=`<div class="status done">حصلتِ على كل الخدمات! خذي نجمة إضافية ⭐</div>`;
  else if(M.used&&M.msg){const m=ITEM_MSG[M.msg];status=`<div class="msg"><span class="mi">${M.msg==="star"?IC.crown:IC[M.msg]}</span><p>${m[0]}<small>${m[1]} يمكنك تغيير اللون ثم الضغط على «تم».</small></p></div>`;}
  else status=`<div class="status view">لتغيير الألوان فقط. الخدمة الجديدة تُكسب بإجابة صحيحة.</div>`;
  $("modal").innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="صالون ${dn(s)}">
    <div><div class="bigMirror" id="bigM">${avatar(s,M.i)}</div></div>
    <div>
      <h2>صالون ${dn(s)}</h2>
      <p class="sub">الخدمات: ${ar(s.order.length)} من ${ar(ITEMS.length)}${s.stars?` · ⭐ ${ar(s.stars)}`:""}</p>
      ${status}
      <div class="tiles">${ITEMS.map(it=>{
        const done=s.look[it.id]!==undefined, pre=!it.lock||s.look[it.lock]!==undefined, avail=M.token&&!done&&!all&&pre;
        const cls=done?"done":avail?"avail":"locked", dis=!done&&!avail?"disabled":"";
        const sw=it.colors?`<div class="sw">${it.colors.map(c=>`<button style="background:${swatch(it,c)}" class="${s.look[it.id]===c?"sel":""}" data-item="${it.id}" data-c="${c}" aria-label="لون" ${dis}></button>`).join("")}</div>`:(!pre&&!done?`<div class="lk">🔒 بعد «${ITEMS.find(x=>x.id===it.lock).name}»</div>`:`<div class="sw"></div>`);
        return `<div class="tile ${cls}"><button class="ic" data-item="${it.id}" ${dis} aria-label="${it.name}">${IC[it.id]}</button><div class="tn">${it.name}</div>${sw}</div>`;
      }).join("")}</div>
      <div class="prow">
        ${M.token&&all?`<button class="btn gold" id="starBtn">⭐ نجمة إضافية</button>`:""}
        <button class="btn green" id="doneBtn">تم ✓</button>
        ${s.order.length||s.stars?`<button class="btn" id="undoBtn">تراجع عن آخر خدمة</button>`:""}
      </div>
    </div></div>`;
}
$("modal").addEventListener("click",e=>{
  if(e.target.id==="modal"||e.target.closest("#doneBtn"))return closeModal();
  const s=S.students[M.i];
  if(e.target.closest("#undoBtn")){
    if(s.stars)s.stars--;else{const last=s.order.pop();delete s.look[last];
      // إزالة ما يعتمد عليه
      ITEMS.forEach(it=>{if(it.lock===last&&s.look[it.id]!==undefined){delete s.look[it.id];s.order=s.order.filter(x=>x!==it.id);}});}
    save();renderModal();return;
  }
  if(e.target.closest("#starBtn")){s.stars++;M.token=false;M.used=true;M.msg="star";save();renderModal();burst();return;}
  const b=e.target.closest("[data-item]");if(!b||b.disabled)return;
  const it=ITEMS.find(x=>x.id===b.dataset.item);
  const done=s.look[it.id]!==undefined;
  const color=b.dataset.c||(it.colors?(s.look[it.id]||it.colors[0]):true);
  if(done){if(it.colors){s.look[it.id]=color;save();renderModal();}return;}
  if(!M.token)return;
  if(it.lock&&s.look[it.lock]===undefined)return;
  s.look[it.id]=color;s.order.push(it.id);M.token=false;M.used=true;M.msg=it.id;save();renderModal();burst();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&M)closeModal();});
function burst(){
  const box=$("bigM");if(!box)return;
  const b=document.createElement("div");b.className="burst";
  for(let k=0;k<14;k++){const i=document.createElement("i");const a=Math.random()*6.28,d=60+Math.random()*90;
    i.style.left="50%";i.style.top="45%";i.style.setProperty("--dx",Math.cos(a)*d+"px");i.style.setProperty("--dy",Math.sin(a)*d+"px");
    i.style.background=["#f2b630","#8456cf","#e94e8a","#1fa391"][k%4];b.appendChild(i);}
  box.appendChild(b);setTimeout(()=>b.remove(),1000);
}

  box.innerHTML=(pick==="group"?`<div class="countRow">عدد المجموعات: ${[2,3,4,5,6].map(k=>`<button class="${S.n===k?"sel":""}" data-n="${k}">${ar(k)}</button>`).join("")}</div>`:"")+
   `<div class="sgrid ${pick==="solo"?"solo":""}">${S.students.slice(0,n).map((s,i)=>`<label class="nslot ${s.name?"filled":""}" id="ns${i}">${avatar({name:s.name,look:{},order:[],stars:0},i)}<input class="nameIn" id="ni${i}" data-ni="${i}" value="${s.name.replace(/"/g,"&quot;")}" placeholder="${pick==="solo"?"اكتبي اسمك":"المجموعة "+ar(i+1)}" autocomplete="off"></label>`).join("")}</div>`;
}
$("introOv").addEventListener("click",e=>{
  const m=e.target.closest("[data-mode]");
  if(m){pick=m.dataset.mode;document.querySelectorAll(".mode").forEach(x=>x.classList.toggle("sel",x.dataset.mode===pick));$("nwarn").textContent="";renderSetup();return;}
  const c=e.target.closest("[data-n]");
  if(c){S.n=+c.dataset.n;save();renderSetup();return;}
  if(!e.target.closest("#goBtn"))return;
  if(!pick){$("nwarn").textContent="اختاري نوع التحدي أولًا: فردي أو جماعي";return;}
  if(pick==="solo"&&!S.students[0].name){$("nwarn").textContent="اكتبي اسمك تحت الخلية";$("ni0")?.focus();return;}
  if(S.mode&&S.mode!==pick){S.students=mkStudents(6).map((x,i)=>({...x,name:S.students[i].name}));S.ans={};S.awarded={};S.q=0;}
  S.mode=pick;save();$("introOv").hidden=true;renderAll();
});
$("introOv").addEventListener("input",e=>{const n=e.target.closest("[data-ni]");if(!n)return;const i=+n.dataset.ni;S.students[i].name=n.value.trim();$("ns"+i).classList.toggle("filled",!!S.students[i].name);$("nwarn").textContent="";save();});
$("howBtn").onclick=showIntro;

/* ===== التتويج والشهادة ===== */
function showWin(){
  const A=active();
  const ranked=A.map((s,i)=>({s,i})).sort((a,b)=>score(b.s)-score(a.s));
  const conf=Array.from({length:40},(_,k)=>`<i style="left:${Math.random()*100}%;background:${["#f2b630","#8456cf","#e94e8a","#1fa391"][k%4]};animation-duration:${3+Math.random()*3}s;animation-delay:${-Math.random()*5}s"></i>`).join("");
  let pod,certs;
  if(S.mode==="solo"){
    const t=ranked[0];
    pod=`<div class="pod only"><div class="pm">${avatar(t.s,t.i)}</div><div class="nm">${dn(t.s)}</div><div class="blk" style="background:var(--gold);color:#3b2a00">أجبتِ صحيحًا عن ${ar(correctCount())} من ${ar(Q.length)}<br>الخدمات ${ar(t.s.order.length)} من ${ar(ITEMS.length)}${t.s.stars?" · ⭐ "+ar(t.s.stars):""}</div></div>`;
    certs=`<button class="btn gold" data-cert="0" data-rank="9">🎓 شهادة ${dn(t.s)}</button>`;
  }else{
    const top=ranked.slice(0,3),order=[top[1],top[0],top[2]].filter(Boolean);
    pod=order.map(t=>{const r=top.indexOf(t);return `<div class="pod p${r+1}"><div class="pm">${avatar(t.s,t.i)}</div><div class="nm">${dn(t.s)}</div><div class="blk">${ar(score(t.s))}</div></div>`;}).join("");
    certs=top.map((t,r)=>`<button class="btn gold" data-cert="${t.i}" data-rank="${r}">🎓 شهادة ${dn(t.s)}</button>`).join("");
    if(ranked.length>3)pod+=`<p style="flex-basis:100%;margin:8px 0 0;color:var(--muted)">${ranked.slice(3).map(t=>`${dn(t.s)}: ${ar(score(t.s))}`).join(" · ")}</p>`;
  }
  $("winOv").innerHTML=`<div class="win">
    <div class="confetti">${conf}</div>
    <img class="side l" src="${IMG.c03}" alt=""><img class="side r" src="${IMG.c13}" alt="">
    <h2>${S.mode==="solo"?"بطلة":"بطلات"} <span>المناعة</span> لهذا اليوم</h2>
    <p style="margin:0;color:var(--muted)">${CONFIG.lesson} · ${CONFIG.teacher}</p>
    <div class="podium">${pod}</div>
    <div class="certrow">${certs}</div>
    <div class="prow" style="justify-content:center;position:relative"><button class="btn green" id="closeWin">العودة للتحدي</button></div>
  </div>`;
  $("winOv").hidden=false;
}
$("winOv").addEventListener("click",e=>{const c=e.target.closest("[data-cert]");if(c){showCert(+c.dataset.cert,+c.dataset.rank);return;}if(e.target.id==="winOv"||e.target.closest("#closeWin"))$("winOv").hidden=true;});
const RANKS=["المركز الأول","المركز الثاني","المركز الثالث"];
function hijri(){try{return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura",{day:"numeric",month:"long",year:"numeric"}).format(new Date());}catch(_){return "";}}
let curCert=0;
function certAvatar(s,i){
  const defs='<defs><linearGradient id="cgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe082"/><stop offset="1" stop-color="#e0a21c"/></linearGradient><linearGradient id="csilver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7f9"/><stop offset="1" stop-color="#9aa6ad"/></linearGradient><linearGradient id="crose" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbd3d6"/><stop offset="1" stop-color="#d27e88"/></linearGradient><filter id="csoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>';
  return avatar(s,i).replace(/url\(#(gold|silver|rose|soft)\)/g,(m,k)=>`url(#c${k})`).replace(/(<svg[^>]*>)/,`$1${defs}`).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="200" height="210" ');
}
function showCert(i,r){curCert=i;
  const s=S.students[i],solo=S.mode==="solo";
  const what=solo?`لتميّزها في «صالون الخلية البائية» في ${CONFIG.lesson}،<br>وإجابتها إجابةً صحيحة عن ${ar(correctCount())} من ${ar(Q.length)} سؤالًا.`
    :`لتميّزها في تحدّي «صالون الخلية البائية» في ${CONFIG.lesson}،<br>وحصولها على ${RANKS[r]} بمجموع ${ar(score(s))} ${score(s)===1?"نقطة":"نقاط"}.`;
  $("certOv").innerHTML=`<div class="cert" role="dialog" aria-modal="true" aria-label="شهادة تميز">
    <div class="frame">
      <div class="top"><div><b>المملكة العربية السعودية</b><br>وزارة التعليم<br>${CONFIG.school}</div><div style="text-align:left">علوم<br>${hijri()}</div></div>
      <h2>شهادة <span>بطلة المناعة</span></h2>
      <div class="body">تُمنح هذه الشهادة ${solo?"للطالبة":"لـ"}<span class="who">${dn(s)}</span>${what}<br>مع تمنياتنا بدوام التألق والنجاح 🌟</div>
      <div><div class="pic">${certAvatar(s,i)}</div><span class="rank">${solo?"بطلة المناعة":RANKS[r]}</span></div>
      <div class="sign"><div><b>معلمة المادة</b>${CONFIG.teacher}</div><div style="text-align:left"><b>التوقيع</b>..............................</div></div>
    </div>
    <div class="prow" style="justify-content:center;margin-top:12px"><button class="btn gold" id="saveCert">📥 حفظ الشهادة صورة</button><button class="btn green" id="closeCert">رجوع للتتويج</button></div>
  </div>`;
  $("certOv").hidden=false;
}
async function saveCert(btn){
  const f=document.querySelector("#certOv .frame");if(!f||!window.html2canvas)return;
  btn.disabled=true;const t=btn.textContent;btn.textContent="جارٍ الحفظ…";
  try{const c=await html2canvas(f,{scale:2,backgroundColor:"#fffdf8",useCORS:true});
    const a=document.createElement("a");a.download="شهادة-"+dn(S.students[curCert])+".png";a.href=c.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();btn.textContent="تم الحفظ ✓";}
  catch(err){btn.textContent="تعذّر الحفظ، صوّري الشاشة";}
  setTimeout(()=>{btn.textContent=t;btn.disabled=false;},2500);
}
$("certOv").addEventListener("click",e=>{if(e.target.closest("#saveCert")){saveCert(e.target.closest("#saveCert"));return;}if(e.target.id==="certOv"||e.target.closest("#closeCert"))$("certOv").hidden=true;});
$("crownBtn").onclick=showWin;
$("resetBtn").onclick=()=>$("confirmOv").hidden=false;
$("noReset").onclick=()=>$("confirmOv").hidden=true;
$("yesReset").onclick=()=>{S=fresh();save();$("confirmOv").hidden=true;renderAll();showIntro();};

function renderAll(){renderHeader();renderQ();renderStudents();}
renderAll();
if(!S.mode)showIntro();
</script>
</body></html>
